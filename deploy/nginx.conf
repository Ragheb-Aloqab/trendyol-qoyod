server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com; # استبدل بالنطاق الخاص بك أو IP الخادم

    # مسار المشروع (يجب أن يشير إلى مجلد public)
    root /var/www/trendyol-qoyod/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    index index.php index.html;

    charset utf-8;

    # توجيه جميع الطلبات إلى index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # زيادة حجم رفع الملفات والوقت إن لزم
    client_max_body_size 64M;

    error_page 404 /index.php;

    # معالجة ملفات PHP عبر PHP-FPM
    # تأكد من إصدار PHP المثبت على الخادم (مثلاً php8.2-fpm أو php8.3-fpm)
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        # أو إذا كنت تستخدم php8.3:
        # fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # منع الوصول للملفات المخفية مثل .env و .git
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # تخزين مؤقت للملفات الثابتة
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
